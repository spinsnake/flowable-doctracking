openapi: 3.0.3
info:
  title: MFU Document Tracking Application API
  version: 0.7.0-p6
  description: |
    Application contract with P1 identity/registry, P2 workflow commands, P3 UI read models and
    P4 default-policy/Model A observations, P5 partial-success bulk and P6 operations/reconciliation. Direct transfer/exception resolution remain P5 scope;
    their presence in this specification is not implementation evidence. See contracts/README.md for scope.
    Flowable is embedded and accessed internally through Java APIs; no engine REST endpoint is exposed here.
    Business decisions D01-D17 remain subject to the decision log and owner approval. Reservation TTL,
    direct-transfer evidence, retention and SLA values are not approved by this contract. D08 partial success was confirmed on 2026-11-07.

    Responses carry validated UUID X-Correlation-ID; error correlation_id matches it. Logs omit raw URLs, query values and bodies.
    All authenticated requests recheck active user/unit, membership, station scope and session version.
    ADMIN means Central Admin. Coordinator is an explicitly granted operational capability, not an implicit role.
    Origin/Station are resource contexts, not client supplied roles. Deny by default; lists, details, timeline
    and evidence all apply the same server authorization. Out-of-scope resources may return 404.

    Mutations require a session-bound X-CSRF-TOKEN; the Google callback instead validates single-use OAuth state,
    nonce and PKCE. Business/provisioning commands require Idempotency-Key scoped to actor + operation + resource,
    with request hash: replay returns the original status/body and key reuse with different input returns 409.
    Validate authorization on replay as well. A document command includes expected_version per item; stale versions
    reject that item without creating its event. Singleton commands return 409; multi-item commands report accepted/rejected per item. Actor and recorded_at come from the session/server, never request input.

    A 202 means the business transaction committed but workflow synchronization is PENDING; it does not mean the next
    Flowable task is available. Clients read the operation/document until APPLIED; FAILED_RETRYABLE is visible and
    retries reference the original operation. Commands advancing the same workflow are blocked while sync is pending.
    Model and route snapshot are immutable after registration; only a new document reads the current default policy.
    Times use UTC RFC3339; the UI displays Asia/Bangkok. All non-redirect responses use Cache-Control: no-store.
servers:
  - url: /api/v1
    description: Same-origin backend behind HTTPS
security:
  - sessionCookie: []
tags:
  - name: Auth
  - name: Provisioning
  - name: Registry
  - name: Tracking
  - name: Operations
  - name: Evidence
paths:
  /auth/google/start:
    get:
      tags: [Auth]
      operationId: startGoogleLogin
      security: []
      summary: Begin backend authorization-code Google login
      description: Rate limited. Generate state, nonce and PKCE; redirect URI is configured server-side. No arbitrary return URL.
      responses:
        '302':
          description: Redirect to Google; transient OAuth correlation cookie has Secure, HttpOnly and SameSite flags.
          headers:
            Location: {schema: {type: string, format: uri}}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /auth/google/callback:
    get:
      tags: [Auth]
      operationId: completeGoogleLogin
      security: []
      summary: Verify Google identity and finalize login
      description: |
        Require valid signature/issuer/audience/expiry, email_verified, exact @mfu.ac.th suffix and configured hd policy.
        Only active allowlisted users can login. First-link google_sub is locked/unique; no automatic user creation.
        Atomically persist regenerated session, login audit and notification outbox before success redirect.
        SMTP delivery is asynchronous and never blocks a finalized login. Replay cannot create a second session/email.
        Google denial may supply error instead of code; validate state and return a sanitized error without echoing secrets.
      parameters:
        - {name: state, in: query, required: true, schema: {type: string, minLength: 1}}
        - {name: code, in: query, schema: {type: string, minLength: 1}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        '302':
          description: Redirect to fixed application location after committed session/audit/email job.
          headers:
            Location: {schema: {type: string}}
            Set-Cookie: {description: 'New application session; Secure, HttpOnly, SameSite=Lax, Path=/. Never return tokens.', schema: {type: string}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Read current effective identity and scope
      responses:
        '200':
          description: No OAuth credentials or session identifiers are returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUser'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /auth/csrf:
    get:
      tags: [Auth]
      operationId: getCsrfToken
      summary: Bootstrap CSRF token for the current authenticated session
      responses:
        '200':
          description: Session-bound token; never store in a URL or log.
          content:
            application/json:
              schema:
                type: object
                required: [header_name, token]
                properties:
                  header_name: {type: string, enum: [X-CSRF-TOKEN]}
                  token: {type: string}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Invalidate application session and clear cookie
      description: Does not log the browser out of Google. Requires CSRF; no business idempotency key is needed.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      responses:
        '204': {description: Application session invalidated.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /units:
    get:
      tags: [Provisioning]
      operationId: listUnits
      summary: List units visible to the caller
      description: ADMIN can also see units waiting for an administrator. Other users see only authorized active units.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Scoped units.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Unit'}}
                  next_cursor: {type: string, nullable: true}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Provisioning]
      operationId: createUnit
      summary: ADMIN creates a unit waiting for UNIT_ADMIN
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name]
              properties:
                code: {type: string, minLength: 1, maxLength: 50}
                name: {type: string, minLength: 1, maxLength: 255}
      responses:
        '201':
          description: Inactive unit created; no user or station is inferred.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Unit'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        default: {$ref: '#/components/responses/Error'}
  /units/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    patch:
      tags: [Provisioning]
      operationId: updateUnit
      summary: ADMIN updates unit details or active status
      description: Reject closing with outstanding custody/tasks without approved resolution. Active unit needs an active UNIT_ADMIN. Audit and revoke affected sessions.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, reason]
              properties:
                expected_version: {type: integer, format: int64, minimum: 0}
                name: {type: string, minLength: 1, maxLength: 255}
                is_active: {type: boolean}
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200':
          description: Updated unit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Unit'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        default: {$ref: '#/components/responses/Error'}
  /users:
    get:
      tags: [Provisioning]
      operationId: listUsers
      summary: ADMIN directory or UNIT_ADMIN own-unit directory
      description: STAFF cannot read the directory. Query parameters never expand caller scope.
      parameters:
        - {name: unit_id, in: query, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Scoped users without raw Google sub, credentials or session identifiers.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/User'}}
                  next_cursor: {type: string, nullable: true}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Provisioning]
      operationId: provisionUser
      summary: Provision allowlisted MFU user and unit membership
      description: |
        ADMIN provisions UNIT_ADMIN/STAFF. UNIT_ADMIN provisions STAFF in own unit only. Appointing UNIT_ADMIN
        and activating a waiting unit commit atomically. No ADMIN creation, self-escalation or cross-unit privilege.
        Courier grants are explicit station-scoped grants outside this unit form; do not infer them from STAFF.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProvisionUser'}
      responses:
        '201':
          description: User awaits first Google login; no password or enrollment link.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        default: {$ref: '#/components/responses/Error'}
  /users/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    patch:
      tags: [Provisioning]
      operationId: updateUser
      summary: Update scoped user, membership or active status
      description: |
        ADMIN or own UNIT_ADMIN under role matrix. UNIT_ADMIN edits own-unit STAFF only and cannot promote to UNIT_ADMIN.
        No Google identity/email editing or ADMIN creation. Reject last-admin removal and unresolved outstanding work
        with 409; revoke affected sessions and audit before success. No hard deletion of history.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, reason]
              properties:
                expected_version: {type: integer, format: int64, minimum: 0}
                display_name: {type: string, minLength: 1, maxLength: 255}
                unit_id: {type: string, format: uuid}
                unit_role: {type: string, enum: [UNIT_ADMIN, STAFF]}
                is_active: {type: boolean}
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200':
          description: Updated identity view.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        default: {$ref: '#/components/responses/Error'}
  /stations:
    get:
      tags: [Registry]
      operationId: listStationDirectory
      summary: Authenticated directory of active station labels for route selection
      description: Minimal directory metadata across active units; no document, user or evidence access is implied.
      responses:
        '200':
          description: Active station labels.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Station'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Provisioning]
      operationId: createStation
      summary: Central Admin explicitly creates a station for an active unit
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [unit_id, code, name]
              properties:
                unit_id: {type: string, format: uuid}
                code: {type: string, minLength: 1, maxLength: 50}
                name: {type: string, minLength: 1, maxLength: 255}
      responses:
        '201':
          description: Explicitly created station; no one-to-one unit mapping is inferred.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Station'}
        default: {$ref: '#/components/responses/Error'}
  /users/{id}/grants:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    patch:
      tags: [Provisioning]
      operationId: replaceUserGrants
      summary: Central Admin replaces explicit business capabilities and station scopes
      description: Reject own-grant modification or unresolved outstanding work; audit and revoke target sessions atomically. ADMIN alone confers no courier or evidence permission.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, station_ids, capabilities, reason]
              properties:
                expected_version: {type: integer, format: int64, minimum: 0}
                station_ids: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
                capabilities: {type: array, uniqueItems: true, items: {type: string, enum: [COURIER, COORDINATOR, RESERVATION_RESOLVE]}}
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200':
          description: User with new explicit scopes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Error'}
  /route-templates:
    get:
      tags: [Registry]
      operationId: listRouteTemplates
      summary: List templates authorized for the origin
      responses:
        '200':
          description: Latest published version of each visible template; earlier versions remain immutable and can be referenced by registrations.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/RouteTemplate'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Registry]
      operationId: createRouteTemplate
      summary: Origin creates a route template version
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RouteTemplateInput'}
      responses:
        '201':
          description: Template created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RouteTemplate'}
        default: {$ref: '#/components/responses/Error'}
  /route-templates/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Registry]
      operationId: reviseRouteTemplate
      summary: Origin publishes a new template version
      description: Existing document snapshots and earlier template versions stay immutable.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/RouteTemplateInput'}
                - type: object
                  required: [expected_version]
                  properties:
                    expected_version: {type: integer, minimum: 1}
      responses:
        '200':
          description: New template version; never mutate snapshots.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RouteTemplate'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Error'}
  /documents:
    get:
      tags: [Registry]
      operationId: listOriginDocuments
      summary: Origin's document registry
      description: scope=origin filters origin ownership, never station worklist membership.
      parameters:
        - {name: scope, in: query, required: true, schema: {type: string, enum: [origin]}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Authorized origin registry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Registry]
      operationId: registerDocument
      summary: Register a document and immutable route/mode snapshots
      description: Origin scope required. The server reads default mode/policy version in the same transaction; no mode override accepted.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [origin_station_id, template_id, template_version]
              description: Trim title and document_number before persistence; at least one must contain a non-whitespace character. Normalize an absent or blank optional value to null.
              anyOf:
                - required: [title]
                  properties:
                    title: {type: string, minLength: 1, pattern: '\S'}
                - required: [document_number]
                  properties:
                    document_number: {type: string, minLength: 1, pattern: '\S'}
              properties:
                title: {type: string, nullable: true, maxLength: 500}
                document_number: {type: string, nullable: true, maxLength: 255}
                origin_station_id: {type: string, format: uuid}
                template_id: {type: string, format: uuid}
                template_version: {type: integer, minimum: 1}
      responses:
        '201': {$ref: '#/components/responses/CommandApplied'}
        '202': {$ref: '#/components/responses/CommandPending'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        default: {$ref: '#/components/responses/Error'}
  /documents/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Registry]
      operationId: getDocument
      summary: Read scoped document state, snapshot and workflow sync
      responses:
        '200':
          description: Authorized state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /documents/{id}/evidence:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Evidence]
      operationId: attachOriginEvidence
      summary: Origin attaches finalized owned photographs to an append-only timeline event
      description: Local EVIDENCE_ATTACHED event with version increment; does not advance Flowable or fabricate pickup/receipt evidence. All images must match the document/origin context and caller.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, evidence_upload_ids]
              properties:
                expected_version: {type: integer, format: int64, minimum: 0}
                evidence_upload_ids: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uuid}}
      responses:
        '200': {$ref: '#/components/responses/CommandApplied'}
        default: {$ref: '#/components/responses/Error'}
  /documents/{id}/timeline:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Registry]
      operationId: getTimeline
      summary: Read scoped append-only timeline with authorized evidence references
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Filter every event/evidence link by the caller's scope.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/TimelineEvent'}}
                  next_cursor: {type: string, nullable: true}
        default: {$ref: '#/components/responses/Error'}
  /documents/{id}/ready:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Tracking]
      operationId: markReady
      summary: Model B unit marks the current step ready
      description: Origin first step may ready after registration; later steps require confirmed unit receipt. No Model A synthetic ready.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StepCommand'}
      responses:
        '200': {$ref: '#/components/responses/CommandApplied'}
        '202': {$ref: '#/components/responses/CommandPending'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        default: {$ref: '#/components/responses/Error'}
  /documents/{id}/confirm-return:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Tracking]
      operationId: confirmReturn
      summary: Origin confirms return at the final Model B route step
      description: Must reference final step_id even when the origin station also occurs at step 1. Only this confirmation completes Model B.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StepCommand'}
      responses:
        '200': {$ref: '#/components/responses/CommandApplied'}
        '202': {$ref: '#/components/responses/CommandPending'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        default: {$ref: '#/components/responses/Error'}
  /documents/{id}/observations:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Tracking]
      operationId: recordObservation
      summary: Explicitly scoped Courier records physical observation in Model A
      description: |
        Requires active COURIER capability and an explicit grant for the active observed station/unit.
        Never infer missing transfer actor/time or create synthetic unit receipt/ready. An exact current-step
        observation records evidence without advancing. Any other occurrence or off-route station records
        OBSERVED_AT + UNOBSERVED_TRANSFER + EXCEPTION_OPENED, holds business state EXCEPTION, and preserves
        current/reported route position and the waiting engine task. X07 remains unapproved: no automatic
        reconciliation, skipped step or completion. Unknown transfer actor/time remain null. Pending sync,
        active reservation/leg/direct transfer, terminal states and existing exceptions reject observation.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, observed_station_id, evidence_upload_ids, reason, physical_presence_confirmed]
              properties:
                expected_version: {type: integer, format: int64, minimum: 0}
                observed_station_id: {type: string, format: uuid}
                proposed_route_step_id: {type: string, format: uuid, nullable: true, description: Required exact occurrence when observed station occurs on route; null only for an off-route station. Repeated station occurrences must be selected explicitly.}
                evidence_upload_ids: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uuid}}
                reason: {type: string, minLength: 1, maxLength: 1000}
                physical_presence_confirmed: {type: boolean, enum: [true]}
      responses:
        '200':
          description: Local evidence persisted atomically; no workflow task is completed by observation.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/CommandResult'}
                  - type: object
                    required: [reconciliation_status, exception_id]
                    properties:
                      reconciliation_status: {type: string, enum: [NOT_REQUIRED, REQUIRES_REVIEW]}
                      exception_id: {type: string, format: uuid, nullable: true}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        default: {$ref: '#/components/responses/Error'}
  /courier/observation-context:
    get:
      tags: [Tracking]
      operationId: getCourierObservationContext
      summary: Minimal context for a known Model A document at an assigned observed station
      description: |
        Requires active COURIER capability and an explicit grant for the selected active station/unit.
        Accepts an off-route station. Model B returns 404. Returns only matching station occurrences,
        not full route, title/number, origin identity or other users. can_observe is a UI hint and is false
        for pending sync, custody, direct transfer, terminal state or exception; mutation independently rechecks.
      parameters:
        - {name: document_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: station_id, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Minimal context; choose an exact occurrence before submitting an on-route observation.
          content:
            application/json:
              schema:
                type: object
                required: [document_id, document_version, tracking_mode, business_state, process_sync_status, latest_operation_id, current_route_step_id, reported_location_step_id, route_steps, can_observe]
                properties:
                  document_id: {type: string, format: uuid}
                  document_version: {type: integer, format: int64, minimum: 0}
                  tracking_mode: {type: string, enum: [MODEL_A]}
                  business_state: {$ref: '#/components/schemas/BusinessState'}
                  process_sync_status: {$ref: '#/components/schemas/ProcessSyncStatus'}
                  latest_operation_id: {type: string, format: uuid, nullable: true, description: 'Present only for an operation owned by this courier; otherwise null. Reload context for another actor''s pending operation.'}
                  current_route_step_id: {type: string, format: uuid}
                  reported_location_step_id: {type: string, format: uuid, nullable: true}
                  route_steps:
                    type: array
                    items:
                      type: object
                      required: [step_id, station_id, sequence]
                      properties:
                        step_id: {type: string, format: uuid}
                        station_id: {type: string, format: uuid}
                        sequence: {type: integer, minimum: 0}
                  can_observe: {type: boolean}
        default: {$ref: '#/components/responses/Error'}
  /stations/{id}/worklist:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Tracking]
      operationId: getStationWorklist
      summary: Eligible pickup worklist for an explicitly authorized Courier
      description: Model B pickup requires ready; Model A list reports last-known position, not a guarantee of physical availability.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Scoped worklist.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentPage'}
        default: {$ref: '#/components/responses/Error'}
  /stations/{id}/unit-worklist:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Tracking]
      operationId: getUnitStationWorklist
      summary: Model B receipt, processing and readiness work at an exact station occurrence
      description: |
        Requires active membership of the station's unit and an explicit station grant. Central Admin and
        Courier capabilities alone grant no access. Includes pending synchronization as read-only rows.
        action_route_step_id identifies the pending receipt occurrence or current processing occurrence;
        repeated visits to the same station never collapse into one step. action is null while sync is
        not APPLIED or custody prevents action. Title and document_number remain null outside active origin
        membership while the G0 field-visibility policy is pending. Model A has no unit receipt/ready queue.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Scoped unit queue with optional server-authorized next action.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/UnitWorklistItem'}}
                  next_cursor: {type: string, format: uuid, nullable: true}
        default: {$ref: '#/components/responses/Error'}
  /courier/legs:
    get:
      tags: [Tracking]
      operationId: listOwnActiveCourierLegs
      summary: Courier resumes own active custody at its exact destination occurrence
      description: |
        At most 100 active legs owned by the current user, ordered by started_at then id. Requires current
        COURIER capability and an active assigned destination station/unit. Revoked destination permission
        removes the leg from this list; it does not transfer custody. Other couriers and Central Admin
        receive no implicit ownership. Includes pending sync for read-only display; no book title/number.
      responses:
        '200':
          description: Own active destination-scoped custody.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/CourierLeg'}}
        default: {$ref: '#/components/responses/Error'}
  /courier/reservations:
    get:
      tags: [Tracking]
      operationId: listOwnReservations
      summary: Courier reads own active single-document reservations
      description: |
        At most 100 most recent own active reservations in currently assigned active stations/units, requiring
        current COURIER capability. ACTIVE may be past expires_at until the expiry worker records expiration;
        clients never treat that as pickup authorization. Item expected_version/document_version are the current
        document version for pickup; reserved_version retains the historical value captured at reservation.
        Top-level version remains the reservation version for cancellation. Includes no book title/number.
      responses:
        '200':
          description: Own active reservation metadata.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ReservationSummary'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Tracking]
      operationId: reservePickup
      summary: Courier reserves one or more documents at a station
      description: |
        Submit 1 to 100 unique documents from one source station. D08 uses partial success: valid items commit immediately;
        rejected items carry sanitized per-item codes/messages. For ten selected documents and two already reserved,
        eight succeed and two are reported as conflicts. Never roll back the eight because of the two business conflicts.
        One transaction with per-item savepoints; a system/transaction failure still rolls back the command.
        Document locks follow UUID string order. One active reservation/leg/direct channel per document.
        A multi-item request with zero accepted returns 200 CommandResult and creates no empty reservation.
        A singleton conflict retains 409. Replay returns the same accepted/rejected without repeating writes.
        TTL comes from server policy; expiry/cancel releases every remaining active member, never IN_TRANSIT custody.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchCommand'}
      responses:
        '200':
          description: Every selected item rejected; no reservation created. Inspect rejected per document.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandResult'}
        '201':
          description: Reservation committed; this is not a physical pickup.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reservation'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        default: {$ref: '#/components/responses/Error'}
  /courier/reservations/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    delete:
      tags: [Tracking]
      operationId: cancelReservation
      summary: Reservation owner or explicitly authorized operator cancels before pickup
      description: |
        Cannot cancel an IN_TRANSIT leg. Version guards the reservation; cancellation is atomic and audited.
        Non-owners require an explicit reservation-resolution grant, resource scope and nonblank reason in the
        optional JSON request body. ADMIN/Coordinator role alone does not grant this action. Missing required
        non-owner reason returns 422; missing grant/scope returns 403. The owner may omit the body.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
        - {name: expected_version, in: query, required: true, schema: {type: integer, format: int64, minimum: 0}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 1000, pattern: '\S', description: Audited operational reason; mandatory when cancelling another user's reservation.}
      responses:
        '200':
          description: Cancelled reservation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reservation'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        default: {$ref: '#/components/responses/Error'}
  /courier/check-receive:
    post:
      tags: [Tracking]
      operationId: checkReceive
      summary: Reservation owner records pickup with validated photo
      description: Both models require physical presence confirmation and finalized evidence. Model B requires ready. Unexpired owner reservation and matching route steps/versions are mandatory. Partial-success items consume only accepted reservation members; the reservation remains active for other members. A shared station-context photo is linked to each accepted event; document-bound photos cannot authorize other documents.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/EvidenceBatchCommand'}
                - type: object
                  required: [reservation_id, physical_presence_confirmed]
                  properties:
                    reservation_id: {type: string, format: uuid}
                    physical_presence_confirmed: {type: boolean, enum: [true]}
      responses:
        '200': {$ref: '#/components/responses/CommandApplied'}
        '202': {$ref: '#/components/responses/CommandPending'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        default: {$ref: '#/components/responses/Error'}
  /courier/check-dropoff:
    post:
      tags: [Tracking]
      operationId: checkDropoff
      summary: Active leg owner records drop-off with validated photo
      description: Submit only documents at the same actual destination station; items identify actor-owned active legs. D08 partial success returns accepted/rejected for each item, including wrong-destination/owner conflicts. Model B opens receipt/return confirmation, Model A never synthesizes it.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/EvidenceBatchCommand'}
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        allOf:
                          - {$ref: '#/components/schemas/BatchItem'}
                          - {type: object, required: [leg_id]}
      responses:
        '200': {$ref: '#/components/responses/CommandApplied'}
        '202': {$ref: '#/components/responses/CommandPending'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        default: {$ref: '#/components/responses/Error'}
  /stations/{id}/confirm-receipt:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Tracking]
      operationId: confirmReceipt
      summary: Model B destination unit confirms selected receipts
      description: Own station only; no mandatory photo for normal receipt. Final-origin return uses confirm-return. D08 partial success is explicit through accepted/rejected; rejected items are never silently removed from a submitted batch.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchCommand'}
      responses:
        '200': {$ref: '#/components/responses/CommandApplied'}
        '202': {$ref: '#/components/responses/CommandPending'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        default: {$ref: '#/components/responses/Error'}
  /stations/{id}/direct-transfer:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Tracking]
      operationId: directTransfer
      summary: Model B unit directly dispatches to next route step
      description: |
        Must own source station, have completed unit processing and have no competing reservation/active courier leg.
        Destination must match immutable route. D06 determines required evidence; no default approval is implied.
        Destination still confirms receipt; direct transfer never fabricates courier Checks.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/BatchCommand'}
                - type: object
                  required: [destination_station_id]
                  properties:
                    destination_station_id: {type: string, format: uuid}
                    evidence_upload_ids: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
                    items:
                      type: array
                      items:
                        allOf:
                          - {$ref: '#/components/schemas/BatchItem'}
                          - {type: object, required: [to_route_step_id]}
      responses:
        '200': {$ref: '#/components/responses/CommandApplied'}
        '202': {$ref: '#/components/responses/CommandPending'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        default: {$ref: '#/components/responses/Error'}
  /evidence/uploads:
    post:
      tags: [Evidence]
      operationId: initiateEvidenceUpload
      summary: Create private photo metadata under an authorized document or station context
      description: Requires an origin document or eligible courier document context, or an assigned station. Uploads are owner-bound; administrator status grants no implicit photo access. No user filenames, arbitrary URLs or public object URLs are accepted.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_type, size_bytes, checksum_sha256]
              anyOf:
                - required: [document_id]
                - required: [station_id]
              properties:
                document_id: {type: string, format: uuid}
                station_id: {type: string, format: uuid}
                content_type: {type: string, enum: [image/jpeg, image/png]}
                size_bytes: {type: integer, format: int64, minimum: 1, maximum: 10485760}
                checksum_sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      responses:
        '201':
          description: Metadata created in INITIATED state; no image evidence exists yet.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceUpload'}
        default: {$ref: '#/components/responses/Error'}
  /evidence/uploads/{id}/content:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Evidence]
      operationId: storeEvidenceContent
      summary: Upload raw owner-bound JPEG or PNG bytes
      description: Content-Type, size and SHA-256 must match metadata. Exact bytes can be retried until finalization; finalized uploads cannot be overwritten. Storage failure rolls back STORED status. CSRF required; no Idempotency-Key needed for this raw-content PUT.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: {type: string, format: binary}
          image/png:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Bytes stored privately; image decode validation has not finalized yet.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceUpload'}
        default: {$ref: '#/components/responses/Error'}
  /evidence/uploads/{id}/finalize:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Evidence]
      operationId: finalizeEvidenceUpload
      summary: Re-read, verify and decode photo before evidence use
      description: Owner authorization rechecked on replay. Require actual JPEG/PNG MIME, exact size/checksum, successful image decode, dimensions at most 10000 each and 25 million pixels. No document transition or evidence link is created by finalization alone.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      responses:
        '200':
          description: Immutable FINALIZED photo metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceUpload'}
        default: {$ref: '#/components/responses/Error'}
  /evidence/{id}/content:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Evidence]
      operationId: downloadEvidence
      summary: Download finalized photo through authenticated private access
      description: Uploader must retain current context access. Other readers require an event link to an authorized origin document. No public bucket URL, guessed-ID access or implicit ADMIN access; sensitive wider station/courier scopes remain closed pending D11/D13.
      responses:
        '200':
          description: Attachment with private/no-store and nosniff headers.
          content:
            image/jpeg:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Error'}
  /operations/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Operations]
      operationId: getOperation
      summary: Poll command outcome and workflow sync under original resource scope
      description: Workflow sync is read for this operation, including nested updated_states; workflow_sync includes persisted delivery status/attempts/retry metadata. Business-state/version snapshots remain the original command outcome.
      responses:
        '200': {$ref: '#/components/responses/CommandApplied'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /admin/workflow-operations/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Operations]
      operationId: getWorkflowDelivery
      summary: Central Admin reads technical delivery status for an original operation ID
      description: Returns operation_id, aggregate process_sync_status and deliveries with id/event_id/document_id/status/attempts/next_retry_at/last_error_code/version; no document titles, photos, token or provider exception data. Singleton results retain status/version compatibility fields. Bulk results require an explicit delivery selection for retry.
      responses:
        '200':
          description: Persisted technical delivery status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowOperation'}
        default: {$ref: '#/components/responses/Error'}
  /admin/workflow-operations/{id}/retry:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Operations]
      operationId: retryWorkflowDelivery
      summary: Central Admin retries the existing failed delivery with an audited reason
      description: Does not create a new business event or replace the original operation. expected_version is the workflow delivery version from the technical status endpoint. For a multi-delivery operation delivery_id is mandatory (422 DELIVERY_REQUIRED); a delivery outside the operation returns 404. Requires RETRY_WAIT or DEAD_LETTER; immutable invalid events remain rejected on retry.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, reason]
              properties:
                delivery_id: {type: string, format: uuid, description: Required for a multi-delivery operation; select exactly one persisted delivery.}
                expected_version: {type: integer, format: int64, minimum: 0}
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '202':
          description: Original delivery requeued; poll the original operation.
          content:
            application/json:
              schema:
                type: object
                required: [operation_id, process_sync_status]
                properties:
                  operation_id: {type: string, format: uuid}
                  process_sync_status: {type: string, enum: [PENDING]}
        default: {$ref: '#/components/responses/Error'}
  /admin/workflow-policy:
    get:
      tags: [Operations]
      operationId: getWorkflowPolicy
      summary: ADMIN reads current default workflow policy
      responses:
        '200':
          description: Default used only when a document is registered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowPolicy'}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [Operations]
      operationId: updateWorkflowPolicy
      summary: ADMIN switches default mode for new documents only
      description: |
        Requires current Central Admin permission. Atomically locks/version-checks the singleton policy and
        appends audit actor/time/reason/old-new modes and policy versions. Audit action WORKFLOW_POLICY_CHANGED
        stores a JSON reason envelope using the existing append-only audit table. Same-mode change returns
        409 POLICY_UNCHANGED; stale version returns 409 STALE_VERSION. Registration takes a policy share lock
        in its business transaction. Existing document modes, policy/route snapshots, tasks, events, evidence
        and running process definitions are never migrated by this operation. Per-document override and active
        instance mode mutation are not exposed; unknown payload properties are rejected.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, default_tracking_mode, reason]
              properties:
                expected_version: {type: integer, format: int64, minimum: 0}
                default_tracking_mode: {$ref: '#/components/schemas/TrackingMode'}
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200':
          description: New version; applies only to new registrations.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowPolicy'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/RuleViolation'}
        default: {$ref: '#/components/responses/Error'}
  /admin/login-notifications:
    get:
      tags: [Operations]
      operationId: listLoginNotifications
      summary: ADMIN reads sanitized login email delivery status
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/NotificationStatus'}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Provider acceptance is not inbox delivery or read confirmation.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/LoginNotification'}}
                  next_cursor: {type: string, nullable: true}
        default: {$ref: '#/components/responses/Error'}
  /admin/login-notifications/{id}/retry:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Operations]
      operationId: retryLoginNotification
      summary: ADMIN retries the original failed notification with audit
      description: No new login or recipient is created. Provider ACK uncertainty may cause duplicate SMTP delivery; preserve stable Message-ID internally.
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, reason]
              properties:
                expected_version: {type: integer, format: int64, minimum: 0}
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '202':
          description: Original job queued for retry; mail is not yet delivered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginNotification'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Error'}
  /admin/operations/summary:
    get:
      tags:
      - Operations
      operationId: getOperationsSummary
      summary: Central Admin reads observed queue counts and failure alerts
      parameters: []
      responses:
        '200':
          description: Redacted technical result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsSummary'
        default:
          $ref: '#/components/responses/Error'
  /admin/operations/workflow-deliveries:
    get:
      tags:
      - Operations
      operationId: listOperationsWorkflowDeliveries
      summary: Central Admin reads technical workflow-deliveries
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
          description: UUID except tasks use opaque task IDs.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: status
        in: query
        schema:
          type: string
          description: Validated queue status; default lists failures requiring attention.
      responses:
        '200':
          description: Redacted technical result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsPage'
        default:
          $ref: '#/components/responses/Error'
  /admin/operations/login-notifications:
    get:
      tags:
      - Operations
      operationId: listOperationsLoginNotifications
      summary: Central Admin reads technical login-notifications
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
          description: UUID except tasks use opaque task IDs.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: status
        in: query
        schema:
          type: string
          description: Validated queue status; default lists failures requiring attention.
      responses:
        '200':
          description: Redacted technical result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsPage'
        default:
          $ref: '#/components/responses/Error'
  /admin/operations/exceptions:
    get:
      tags:
      - Operations
      operationId: listOperationsExceptions
      summary: Central Admin reads technical exceptions
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
          description: UUID except tasks use opaque task IDs.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Redacted technical result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsPage'
        default:
          $ref: '#/components/responses/Error'
  /admin/operations/audit-events:
    get:
      tags:
