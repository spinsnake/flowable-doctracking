  /admin/operations/reconciliation/findings:
    get:
      tags:
      - Operations
      operationId: listReconciliationFindings
      summary: Central Admin reads persisted diagnostic findings
      parameters:
      - name: state
        in: query
        schema:
          type: string
          enum:
          - OPEN
          - RESOLVED
          default: OPEN
      - name: document_id
        in: query
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
      responses:
        '200':
          description: Redacted technical result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReconciliationFinding'
        default:
          $ref: '#/components/responses/Error'
  /admin/operations/reconciliation/scan:
    post:
      tags:
      - Operations
      operationId: scanWorkflowReconciliation
      summary: Central Admin audits bounded ledger/projection/engine comparison without
        business advancement
      parameters:
      - $ref: '#/components/parameters/Csrf'
      - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationScan'
      responses:
        '200':
          description: Redacted technical result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scanned:
                    type: integer
                    minimum: 0
                  pending:
                    type: integer
                    minimum: 0
                  mismatches:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                    minimum: 0
        default:
          $ref: '#/components/responses/Error'
      description: Writes diagnostics and audit only. Never creates receipts, Check
        events, custody corrections or automatic task advancement. Pending outbox defers
        engine comparison but canonical ledger/projection checks still run. CSRF, idempotency
        and nonblank reason required.
  /admin/operations/orphan-uploads/cleanup:
    post:
      tags:
      - Operations
      operationId: cleanupOrphanUploads
      summary: Central Admin audits preview or approved cleanup of staged unlinked uploads
      parameters:
      - $ref: '#/components/parameters/Csrf'
      - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
              required:
              - dry_run
              - limit
              - reason
              additionalProperties: false
      responses:
        '200':
          description: Redacted technical result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
      description: Disabled by default; positive approved grace period required. Never
        deletes finalized/linked evidence. Batch metadata, command receipt and audit
        share a transaction with per-upload savepoints. External exact-key deletion
        is idempotent; DB rollback retains metadata for retry. No evidence/document/audit
        retention policy is inferred.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Opaque Spring Session cookie over HTTPS; Secure, HttpOnly, SameSite=Lax. Google tokens never reach frontend storage.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Csrf:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Session-bound token from GET /auth/csrf. Missing/invalid token returns 403.
      schema: {type: string, minLength: 1}
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique command key; reuse only to retry identical request for the same actor/operation/resource.
      schema: {type: string, minLength: 8, maxLength: 200, pattern: '^[A-Za-z0-9._:-]{8,200}$'}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
  responses:
    CommandApplied:
      description: Persisted command or current operation state; inspect process_sync_status rather than assuming task availability.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CommandResult'}
    CommandPending:
      description: Business transaction committed; workflow synchronization pending. Poll Location. Do not submit the next transition yet.
      headers:
        Location: {description: 'Relative /api/v1/operations/{operation_id} URL.', schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CommandResult'}
    BadRequest:
      description: Invalid input or expired/replayed/malformed OAuth callback; no side effect.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unauthenticated:
      description: Missing, expired or revoked application session.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Forbidden:
      description: Role, active-unit, station, ownership or CSRF requirement failed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: Resource not found or not visible in the caller's scope.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Conflict:
      description: Stale version, competing reservation/leg, expired reservation, pending sync, last-admin/outstanding-work guard or idempotency payload mismatch.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    RuleViolation:
      description: Input parsed but violates model, route, validated-evidence or approved business policy. No implicit approval of pending decisions.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unavailable:
      description: Provider/config/persistence unavailable; login is not finalized if session/audit/outbox cannot commit.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Error:
      description: 'Application error; code and correlation_id are stable/sanitized. May include 400, 401, 403, 404, 409, 422, 429 or 503.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    Station:
      type: object
      required: [id, unit_id, code, name]
      properties:
        id: {type: string, format: uuid}
        unit_id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
    EvidenceUpload:
      type: object
      required: [id, status, content_type, size_bytes, checksum_sha256, document_id, station_id, finalized_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [INITIATED, STORED, FINALIZED]}
        content_type: {type: string, enum: [image/jpeg, image/png]}
        size_bytes: {type: integer, format: int64, minimum: 1}
        checksum_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        document_id: {type: string, format: uuid, nullable: true}
        station_id: {type: string, format: uuid, nullable: true}
        finalized_at: {type: string, format: date-time, nullable: true}
    ReservationSummary:
      type: object
      required: [id, owner_user_id, station_id, status, expires_at, version, operation_id, correlation_id, items]
      properties:
        id: {type: string, format: uuid}
        owner_user_id: {type: string, format: uuid}
        station_id: {type: string, format: uuid}
        status: {type: string, enum: [ACTIVE, CANCELLED, EXPIRED, CONSUMED]}
        expires_at: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
        operation_id: {type: string, format: uuid}
        correlation_id: {type: string}
        items: {type: array, items: {$ref: '#/components/schemas/ReservationItem'}}
    ReservationItem:
      type: object
      required: [document_id, route_step_id, reserved_version, expected_version, document_version, business_state, process_sync_status, latest_operation_id, tracking_mode]
      properties:
        document_id: {type: string, format: uuid}
        route_step_id: {type: string, format: uuid}
        reserved_version: {type: integer, format: int64, minimum: 0, description: Historical document version immediately after reservation.}
        expected_version: {type: integer, format: int64, minimum: 0, description: Current document version for the next pickup command.}
        document_version: {type: integer, format: int64, minimum: 0}
        business_state: {$ref: '#/components/schemas/BusinessState'}
        process_sync_status: {$ref: '#/components/schemas/ProcessSyncStatus'}
        latest_operation_id: {type: string, format: uuid, nullable: true}
        tracking_mode: {$ref: '#/components/schemas/TrackingMode'}
    CourierLeg:
      type: object
      additionalProperties: false
      required: [id, document_id, from_step_id, to_step_id, from_station_id, to_station_id, started_at, document_version, process_sync_status, business_state, tracking_mode, latest_operation_id]
      properties:
        id: {type: string, format: uuid}
        document_id: {type: string, format: uuid}
        from_step_id: {type: string, format: uuid}
        to_step_id: {type: string, format: uuid}
        from_station_id: {type: string, format: uuid}
        to_station_id: {type: string, format: uuid}
        started_at: {type: string, format: date-time}
        document_version: {type: integer, format: int64, minimum: 0}
        process_sync_status: {$ref: '#/components/schemas/ProcessSyncStatus'}
        business_state: {$ref: '#/components/schemas/BusinessState'}
        tracking_mode: {$ref: '#/components/schemas/TrackingMode'}
        latest_operation_id: {type: string, format: uuid, nullable: true}
    UnitWorklistItem:
      allOf:
        - {$ref: '#/components/schemas/Document'}
        - type: object
          required: [action_route_step_id, action]
          properties:
            action_route_step_id: {type: string, format: uuid}
            action: {type: string, nullable: true, enum: [CONFIRM_RECEIPT, READY, CONFIRM_RETURN, null], description: Null means status-only; never authorize a mutation from the client alone.}
    TrackingMode: {type: string, enum: [MODEL_A, MODEL_B]}
    ProcessSyncStatus: {type: string, enum: [APPLIED, PENDING, FAILED_RETRYABLE]}
    BusinessState:
      type: string
      enum: [REGISTERED, WAIT_ORIGIN_READY, AWAIT_PHYSICAL_PICKUP, READY_FOR_PICKUP, PICKUP_RESERVED, IN_TRANSIT, DROPPED_OFF_UNCONFIRMED, PENDING_UNIT_RECEIPT, UNIT_PROCESSING, DIRECT_UNIT_IN_TRANSIT, PENDING_ORIGIN_RETURN_RECEIPT, COURIER_TRACKING_COMPLETE, COMPLETED, EXCEPTION]
    Unit:
      type: object
      required: [id, code, name, is_active, provisioning_status, version]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        is_active: {type: boolean}
        provisioning_status: {type: string, enum: [WAITING_UNIT_ADMIN, READY]}
        version: {type: integer, format: int64, minimum: 0}
    ProvisionUser:
      type: object
      additionalProperties: false
      required: [email, display_name, unit_id, unit_role]
      properties:
        email: {type: string, format: email, pattern: '^[^@\s]+@mfu\.ac\.th$'}
        display_name: {type: string, minLength: 1, maxLength: 255}
        unit_id: {type: string, format: uuid}
        unit_role: {type: string, enum: [UNIT_ADMIN, STAFF]}
    User:
      type: object
      required: [id, email, display_name, is_active, identity_status, system_roles, memberships, version]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string}
        is_active: {type: boolean}
        identity_status: {type: string, enum: [AWAITING_FIRST_GOOGLE_LOGIN, GOOGLE_LINKED]}
        system_roles: {type: array, uniqueItems: true, items: {type: string, enum: [ADMIN, COURIER]}}
        memberships:
          type: array
          items:
            type: object
            required: [unit_id, role, is_active]
            properties:
              unit_id: {type: string, format: uuid}
              role: {type: string, enum: [UNIT_ADMIN, STAFF]}
              is_active: {type: boolean}
        version: {type: integer, format: int64, minimum: 0}
    CurrentUser:
      allOf:
        - {$ref: '#/components/schemas/User'}
        - type: object
          required: [station_ids, capabilities]
          properties:
            station_ids: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
            capabilities: {type: array, uniqueItems: true, items: {type: string}, description: 'Explicit effective permissions, including coordinator capability when granted.'}
    RouteTemplateInput:
      type: object
      required: [name, origin_unit_id, station_ids]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        origin_unit_id: {type: string, format: uuid}
        station_ids:
          type: array
          minItems: 2
          description: Ordered route including final return to origin. Repeated station is valid; each occurrence gets distinct step_id.
          items: {type: string, format: uuid}
    RouteTemplate:
      allOf:
        - {$ref: '#/components/schemas/RouteTemplateInput'}
        - type: object
          required: [id, version]
          properties:
            id: {type: string, format: uuid}
            version: {type: integer, minimum: 1}
    RouteStep:
      type: object
      required: [step_id, sequence, station_id]
      properties:
        step_id: {type: string, format: uuid}
        sequence: {type: integer, minimum: 0, description: 'Zero-based position in the immutable route snapshot; origin is 0, and the final return has its own later sequence and step_id.'}
        station_id: {type: string, format: uuid}
    Document:
      type: object
      required: [id, title, origin_unit_id, origin_station_id, tracking_mode, policy_version, route_snapshot, business_state, version, current_route_step_id, pending_receipt_step_id, reported_location_step_id, process_sync_status]
      properties:
        id: {type: string, format: uuid}
        title: {type: string, nullable: true, description: Null when the document was registered using only document_number.}
        document_number: {type: string, nullable: true}
        origin_unit_id: {type: string, format: uuid}
        origin_station_id: {type: string, format: uuid}
        tracking_mode: {$ref: '#/components/schemas/TrackingMode'}
        policy_version: {type: integer, format: int64}
        route_snapshot: {type: array, items: {$ref: '#/components/schemas/RouteStep'}}
        business_state: {$ref: '#/components/schemas/BusinessState'}
        version: {type: integer, format: int64, minimum: 0}
        current_route_step_id: {type: string, format: uuid, description: 'Current business route cursor; never inferred from station name. See P0 transition matrix for advancement.'}
        pending_receipt_step_id: {type: string, format: uuid, nullable: true, description: 'Destination step awaiting Model B receipt/return confirmation; separate from the current business cursor. Null when no receipt is pending.'}
        reported_location_step_id: {type: string, format: uuid, nullable: true, description: 'Last reported station occurrence; not physical proof and not in-transit custody.'}
        active_leg_id: {type: string, format: uuid, nullable: true}
        process_sync_status: {$ref: '#/components/schemas/ProcessSyncStatus'}
        latest_operation_id: {type: string, format: uuid, nullable: true}
    DocumentPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Document'}}
        next_cursor: {type: string, nullable: true}
    StepCommand:
      type: object
      additionalProperties: false
      required: [route_step_id, expected_version]
      properties:
        route_step_id: {type: string, format: uuid}
        expected_version: {type: integer, format: int64, minimum: 0}
    BatchItem:
      type: object
      additionalProperties: false
      required: [document_id, route_step_id, expected_version]
      properties:
        document_id: {type: string, format: uuid}
        route_step_id: {type: string, format: uuid, description: 'Pickup/ready source step or receipt/drop-off destination step for the named command.'}
        expected_version: {type: integer, format: int64, minimum: 0}
        leg_id: {type: string, format: uuid, description: Required for check-dropoff; must be the actor's active leg.}
        to_route_step_id: {type: string, format: uuid, description: Required for direct-transfer; must be the next permitted destination occurrence.}
    BatchCommand:
      type: object
      required: [station_id, items]
      properties:
        station_id: {type: string, format: uuid, description: Must match path station where present.}
        items: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {$ref: '#/components/schemas/BatchItem'}, description: 'No repeated document_id; server validates selection uniqueness.'}
    EvidenceBatchCommand:
      allOf:
        - {$ref: '#/components/schemas/BatchCommand'}
        - type: object
          required: [evidence_upload_ids]
          properties:
            evidence_upload_ids:
              type: array
              minItems: 1
              uniqueItems: true
              description: 'Only finalized, validated, authorized uploads. Shared batch photo links to every selected item; upload failure prevents the entire affected command.'
              items: {type: string, format: uuid}
    Reservation:
      type: object
      allOf:
        - {$ref: '#/components/schemas/CommandResult'}
      required: [id, owner_user_id, station_id, items, status, expires_at, version, operation_id, correlation_id]
      properties:
        id: {type: string, format: uuid}
        owner_user_id: {type: string, format: uuid}
        station_id: {type: string, format: uuid}
        items: {type: array, items: {$ref: '#/components/schemas/ReservationItem'}}
        status: {type: string, enum: [ACTIVE, CANCELLED, EXPIRED, CONSUMED]}
        expires_at: {type: string, format: date-time, description: Server time based on configured policy; no hard-coded TTL approval.}
        version: {type: integer, format: int64, minimum: 0}
        operation_id: {type: string, format: uuid}
        correlation_id: {type: string}
    WorkflowOperation:
      type: object
      required: [operation_id, process_sync_status, deliveries]
      properties:
        operation_id: {type: string, format: uuid}
        process_sync_status: {$ref: '#/components/schemas/ProcessSyncStatus'}
        deliveries: {type: array, items: {$ref: '#/components/schemas/WorkflowDelivery'}}
        status: {type: string, description: Present for a singleton delivery only.}
        attempts: {type: integer, minimum: 0}
        next_retry_at: {type: string, format: date-time}
        last_error_code: {type: string, nullable: true}
        version: {type: integer, format: int64, minimum: 0}
    WorkflowDelivery:
      type: object
      required: [status, attempts, next_retry_at, version]
      properties:
        id: {type: string, format: uuid, description: Recovery endpoint delivery selector.}
        delivery_id: {type: string, format: uuid, description: Operation polling delivery selector.}
        event_id: {type: string, format: uuid}
        document_id: {type: string, format: uuid}
        operation_id: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, RETRY_WAIT, APPLIED, DEAD_LETTER]}
        attempts: {type: integer, minimum: 0}
        next_retry_at: {type: string, format: date-time}
        last_error_code: {type: string, nullable: true}
        version: {type: integer, format: int64, minimum: 0}
    CommandResult:
      type: object
      required: [operation_id, document_ids, accepted, rejected, event_ids, updated_states, process_sync_status, correlation_id]
      properties:
        operation_id: {type: string, format: uuid}
        batch_id: {type: string, format: uuid, description: Alias of operation_id for per-document batch events.}
        document_ids: {type: array, items: {type: string, format: uuid}}
        accepted: {type: array, items: {type: string, format: uuid}}
        rejected: {type: array, items: {$ref: '#/components/schemas/ItemError'}}
        event_ids: {type: array, items: {type: string, format: uuid}}
        updated_states:
          type: array
          items:
            type: object
            required: [document_id, version, business_state, process_sync_status]
            properties:
              document_id: {type: string, format: uuid}
              version: {type: integer, format: int64, minimum: 0}
              business_state: {$ref: '#/components/schemas/BusinessState'}
              process_sync_status: {$ref: '#/components/schemas/ProcessSyncStatus'}
        process_sync_status: {$ref: '#/components/schemas/ProcessSyncStatus'}
        correlation_id: {type: string}
        deliveries: {type: array, items: {$ref: '#/components/schemas/WorkflowDelivery'}}
        workflow_sync:
          oneOf:
            - {$ref: '#/components/schemas/WorkflowDelivery'}
            - type: object
              required: [deliveries]
              properties:
                deliveries: {type: array, items: {$ref: '#/components/schemas/WorkflowDelivery'}}
    ItemError:
      type: object
      required: [document_id, code, message]
      properties:
        document_id: {type: string, format: uuid}
        code: {type: string, example: STALE_VERSION}
        message: {type: string, description: Sanitized; no out-of-scope state or ownership data.}
        current_version: {type: integer, format: int64, minimum: 0}
        current_state: {$ref: '#/components/schemas/BusinessState'}
    ApiError:
      type: object
      required: [code, message, correlation_id]
      properties:
        code: {type: string, example: RESERVATION_CONFLICT}
        message: {type: string}
        correlation_id: {type: string}
        item_errors: {type: array, items: {$ref: '#/components/schemas/ItemError'}}
        operation_id: {type: string, format: uuid, description: Only when identifying an already committed operation.}
    TimelineEvent:
      type: object
      required: [event_id, event_type, document_id, sequence, recorded_at, actor_id, evidence_ids]
      properties:
        event_id: {type: string, format: uuid}
        event_type: {type: string, example: COURIER_DROPPED_OFF}
        document_id: {type: string, format: uuid}
        sequence: {type: integer, format: int64, minimum: 1}
        route_step_id: {type: string, format: uuid, nullable: true}
        from_step_id: {type: string, format: uuid, nullable: true}
        to_step_id: {type: string, format: uuid, nullable: true}
        recorded_at: {type: string, format: date-time}
        actor_id: {type: string, format: uuid, nullable: true, description: Null for unobserved transfer; never invent actor/time.}
        actor_display_name: {type: string, nullable: true, description: Current display name for the stable audit actor_id; null for a system event.}
        evidence_ids: {type: array, items: {type: string, format: uuid}, description: IDs are not public URLs; evidence access must authorize document/event/upload.}
        observation:
          type: object
          nullable: true
          description: Present only for observation/gap/exception events. recorded_at is the observation recording time, never an inferred transfer time.
          properties:
            observed_station_id: {type: string, format: uuid}
            proposed_route_step_id: {type: string, format: uuid, nullable: true}
            previous_route_step_id: {type: string, format: uuid}
            previous_reported_location_step_id: {type: string, format: uuid, nullable: true}
            reason: {type: string}
            physical_presence_confirmed: {type: boolean, enum: [true]}
            reconciliation_status: {type: string, enum: [NOT_REQUIRED, REQUIRES_REVIEW]}
            transfer_actor_id: {type: string, format: uuid, nullable: true}
            transfer_started_at: {type: string, format: date-time, nullable: true}
            transfer_arrived_at: {type: string, format: date-time, nullable: true}
            missing_transfer_evidence: {type: boolean}
            exception_id: {type: string, format: uuid}
            previous_state: {$ref: '#/components/schemas/BusinessState'}
            code: {type: string, enum: [WRONG_STATION, UNOBSERVED_TRANSFER]}
    WorkflowPolicy:
      type: object
      required: [default_tracking_mode, version, changed_at, changed_by, change_reason]
      properties:
        default_tracking_mode: {$ref: '#/components/schemas/TrackingMode'}
        version: {type: integer, format: int64, minimum: 0}
        changed_at: {type: string, format: date-time}
        changed_by: {type: string, format: uuid, nullable: true, description: Actor of this policy version; null for the seeded initial policy.}
        change_reason: {type: string, nullable: true, description: Human reason extracted from this version's JSON audit envelope; null for initial policy.}
    NotificationStatus:
      type: string
      enum: [PENDING, PROCESSING, RETRY_WAIT, ACCEPTED_BY_PROVIDER, FAILED]
    LoginNotification:
      type: object
      required: [id, recipient, status, attempt_count, version]
      properties:
        id: {type: string, format: uuid}
        recipient: {type: string, format: email}
        status: {$ref: '#/components/schemas/NotificationStatus'}
        attempt_count: {type: integer, minimum: 0}
        next_retry_at: {type: string, format: date-time, nullable: true}
        last_error_code: {type: string, nullable: true, description: Sanitized error code only; never provider credentials/raw responses.}
        version: {type: integer, format: int64, minimum: 0}

    OperationsSummary:
      type: object
      properties:
        workflow:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        mail:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        open_exceptions:
          type: integer
          minimum: 0
        waiting_tasks:
          type: integer
          minimum: 0
        oldest_waiting_age_seconds:
          type: integer
          minimum: 0
        reconciliation_open:
          type: integer
          minimum: 0
        alerts:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                - WORKFLOW_DEAD_LETTER
                - MAIL_DELIVERY_FAILED
                - RECONCILIATION_MISMATCH
              count:
                type: integer
                minimum: 0
    OperationsPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            description: Category-specific technical IDs, safe codes, states, times and
              attempts; excludes document titles, recipients, evidence keys and audit
              reasons.
        next_cursor:
          type: string
          nullable: true
    OperationsEngine:
      type: object
      properties:
        document_id:
          type: string
          format: uuid
        business_state:
          $ref: '#/components/schemas/BusinessState'
        process_sync_status:
          $ref: '#/components/schemas/ProcessSyncStatus'
        current_route_step_id:
          type: string
          format: uuid
        pending_receipt_step_id:
          type: string
          format: uuid
          nullable: true
        mapping:
          type: object
          nullable: true
          properties:
            process_instance_id:
              type: string
            process_definition_id:
              type: string
            process_definition_version:
              type: integer
              minimum: 0
        tasks:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              task_key:
                type: string
              created_at:
                type: string
                format: date-time
              binding:
                type: object
                additionalProperties:
                  type: string
                  format: uuid
    ReconciliationFinding:
      type: object
      properties:
        document_id:
          type: string
          format: uuid
        code:
          type: string
        state:
          type: string
          enum:
          - OPEN
          - RESOLVED
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        sightings:
          type: integer
          minimum: 0
    ReconciliationScan:
      type: object
      properties:
        document_id:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
      required:
      - reason
      additionalProperties: false
