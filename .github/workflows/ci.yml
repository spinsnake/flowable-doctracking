name: Development checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  operations-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s scripts -p test_operations.py -v
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: doctracking_test
          POSTGRES_USER: doctracking_test
          POSTGRES_PASSWORD: ci-disposable-only
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U doctracking_test -d doctracking_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/doctracking_test
      TEST_DB_USER: doctracking_test
      TEST_DB_PASSWORD: ci-disposable-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: chmod +x backend/mvnw
      - run: ./mvnw --batch-mode --no-transfer-progress verify
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm test && npm run build
        working-directory: frontend
